name: Build & publish static site

# Builds the Astro site on every push to main and publishes dist/ to the "deploy" branch.
# On Hostinger: hPanel → Advanced → GIT → repository = this repo, branch = deploy,
# directory = public_html (empty). Enable Auto Deployment with the webhook URL hPanel gives you.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish dist to deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: deploy
          # keep history so Hostinger's "git pull" can fast-forward on every deploy
          force_orphan: false
          keep_files: false
          enable_jekyll: true
          commit_message: 'deploy: ${{ github.sha }}'
